<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c1417"/>
      <stop offset="50%" stop-color="#6b0e10"/>
      <stop offset="100%" stop-color="#420607"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Shape -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" filter="url(#shadow)"/>

  <!-- Inner Ornate Border -->
  <rect x="42" y="42" width="428" height="428" rx="84" fill="none" stroke="#d97706" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="8 6"/>

  <!-- D20 Geometric Outline -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Central Triangle (Main Face) -->
    <polygon points="0,-120 104,60 -104,60" fill="url(#facetLight)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Top-Left Upper Face -->
    <polygon points="0,-120 -104,60 -150,-35" fill="url(#facetDark)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Top-Right Upper Face -->
    <polygon points="0,-120 104,60 150,-35" fill="url(#facetLight)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Top Cap Triangle -->
    <polygon points="0,-120 -150,-35 0,-175" fill="url(#facetLight)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="0,-120 150,-35 0,-175" fill="url(#facetDark)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Bottom Central Triangle Face -->
    <polygon points="-104,60 104,60 0,165" fill="url(#facetDark)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Bottom Left Face -->
    <polygon points="-104,60 0,165 -135,115" fill="url(#facetLight)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Bottom Right Face -->
    <polygon points="104,60 0,165 135,115" fill="url(#facetDark)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Far Left Outer Flange -->
    <polygon points="-104,60 -150,-35 -135,115" fill="url(#facetDark)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>

    <!-- Far Right Outer Flange -->
    <polygon points="104,60 150,-35 135,115" fill="url(#facetLight)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>

    <!-- 20 Number on Main Face -->
    <text x="0" y="15" font-family="'Cinzel', 'Georgia', serif" font-size="76" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2">20</text>
  </g>
</svg>
